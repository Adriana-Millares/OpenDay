<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciudad Anáhuac · Junta directiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#1D2433; --muted:#5A6375; --line:#D7DDE6;
  --accent:#D9501A; --accent-soft:#FBE7DD; --accent-ink:#FFFFFF;
  --teal:#0E6E74; --teal-soft:#DDF0F0;
  --good:#1F7F55; --good-soft:#DFF2E8; --bad:#BC3328; --bad-soft:#F8E1DE; --warn:#9A6411;
  --sky1:#BFDDF2; --sky2:#EEF1F5; --bldg:#33405B; --bldg2:#46557A; --win-on:#FFC857; --win-off:#56637F; --ground:#A9BD8F; --tree:#4E8A55;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121825; --surface:#1A2232; --surface2:#20293B; --ink:#E7EBF2; --muted:#9BA5B8; --line:#2E394D;
    --accent:#FF6C30; --accent-soft:#3A2419; --accent-ink:#1A1206;
    --teal:#4FB8BE; --teal-soft:#17323A;
    --good:#4CC28C; --good-soft:#163428; --bad:#FF7A6E; --bad-soft:#3A1E1C; --warn:#E5B04F;
    --sky1:#1C2E4A; --sky2:#121825; --bldg:#3A4B6D; --bldg2:#4B5E86; --win-on:#FFD27A; --win-off:#2A3550; --ground:#2E4232; --tree:#3F7A4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121825; --surface:#1A2232; --surface2:#20293B; --ink:#E7EBF2; --muted:#9BA5B8; --line:#2E394D;
  --accent:#FF6C30; --accent-soft:#3A2419; --accent-ink:#1A1206;
  --teal:#4FB8BE; --teal-soft:#17323A;
  --good:#4CC28C; --good-soft:#163428; --bad:#FF7A6E; --bad-soft:#3A1E1C; --warn:#E5B04F;
  --sky1:#1C2E4A; --sky2:#121825; --bldg:#3A4B6D; --bldg2:#4B5E86; --win-on:#FFD27A; --win-off:#2A3550; --ground:#2E4232; --tree:#3F7A4A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.num{font-family:Archivo,"Arial Narrow",system-ui,sans-serif}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;font-stretch:75%;font-weight:800;letter-spacing:-.01em}
h2{font-size:26px;line-height:1.15;margin:0 0 6px;font-stretch:85%;font-weight:750}
h3{font-size:18px;margin:0;font-stretch:95%;font-weight:700}
p{margin:0 0 10px;max-width:68ch}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topin{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:14px}
.years{display:flex;gap:4px;align-items:center}
.years span{width:22px;height:8px;border-radius:4px;background:var(--line)}
.years span.done{background:var(--accent)}
.years span.now{background:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;line-height:1.1}
.kpi b{font-family:Archivo,sans-serif;font-size:24px;font-stretch:80%}
.kpi small{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.city{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.city svg{display:block;width:100%;height:auto}
.ind{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:12px 0 0}
.ind .lab{font-size:15px}
.ind .val{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;text-align:right}
.bar{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--teal);transition:width .6s ease}
.bar i.low{background:var(--bad)} .bar i.mid{background:var(--warn)}
.delta{font-size:13px;font-weight:700;margin-left:4px}
.up{color:var(--good)} .down{color:var(--bad)}
.sector{display:grid;grid-template-columns:34px 1fr 92px;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sector:last-of-type{border-bottom:0}
.sector .ic{font-size:24px;text-align:center}
.sector .nm{font-weight:700}
.sector .ds{font-size:14px;color:var(--muted);line-height:1.3}
.sector .amt{text-align:right;font-family:Archivo,sans-serif}
.sector .amt b{font-size:22px;font-stretch:80%}
.sector .amt small{display:block;color:var(--muted);font-size:13px}
.sector input[type=range]{grid-column:2/4;width:100%;accent-color:var(--accent)}
.sector.req .nm::after{content:" · mínimo obligatorio";color:var(--bad);font-weight:600;font-size:14px}
.sumbar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);margin:8px -18px -18px;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:0 0 14px 14px}
.sumbar .s{font-family:Archivo,sans-serif;font-size:22px;font-weight:750}
.note{padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:15px;margin:10px 0}
.note.bad{background:var(--bad-soft);border-color:transparent}
.note.good{background:var(--good-soft);border-color:transparent}
.note.teal{background:var(--teal-soft);border-color:transparent}
.sit{border-left:6px solid var(--bad);padding-left:14px;margin:6px 0 14px}
.sit.op{border-color:var(--good)} .sit.ex{border-color:var(--warn)}
.sit .em{font-size:44px;line-height:1}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--bad-soft);color:var(--bad);margin-bottom:6px}
.tag.op{background:var(--good-soft);color:var(--good)} .tag.ex{background:var(--accent-soft);color:var(--warn)}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:140px;resize:vertical}
label.f{display:block;font-weight:700;margin:12px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.changes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:12px 0}
.chg{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px}
.chg small{color:var(--muted);display:block;font-size:13px}
.chg b{font-family:Archivo,sans-serif;font-size:22px}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .panel{width:min(560px,100%);max-height:90vh;overflow:auto}
footer{text-align:center;color:var(--muted);font-size:14px;padding:20px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline}
.hero-setup{max-width:720px;margin:24px auto}
.final-score{font-family:Archivo,sans-serif;font-size:clamp(80px,14vw,150px);font-weight:800;font-stretch:70%;line-height:.9;color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.ok{color:var(--good);font-weight:700} .no{color:var(--bad);font-weight:700}
body.present{font-size:20px}
body.present .final-score{font-size:clamp(120px,18vw,220px)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}.shake{animation:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="app"></main>
<footer><button id="facBtn" type="button">Panel del facilitador</button></footer>

<div class="modal" id="modal"><div class="panel" id="modalBody"></div></div>

<script>
/* ===================== Configuración ===================== */
const KEY = 'ciudad-anahuac-v2';
const YEARS = 10;
const SECTORS = [
  {id:'ch',   name:'Capital humano', desc:'Sueldos, contratación y formación de profesores y personal', ideal:28, icon:'👩‍🏫'},
  {id:'infra',name:'Infraestructura', desc:'Edificios, salones, mantenimiento y energía', ideal:14, icon:'🏗️'},
  {id:'tec',  name:'Tecnología y laboratorios', desc:'Equipo de laboratorio, software, red y ciberseguridad', ideal:12, icon:'💻'},
  {id:'becas',name:'Becas y apoyo financiero', desc:'Becas académicas, deportivas y por necesidad económica', ideal:12, icon:'🎓'},
  {id:'vida', name:'Vida estudiantil y bienestar', desc:'Deportes, cultura, salud mental y grupos estudiantiles', ideal:10, icon:'⚽'},
  {id:'vin',  name:'Vinculación e internacionalización', desc:'Empresas, prácticas profesionales, Coventry e intercambios', ideal:8, icon:'🌍'},
  {id:'mkt',  name:'Promoción y admisiones', desc:'Campañas, ferias y atención a aspirantes', ideal:8, icon:'📣'},
  {id:'res',  name:'Fondo de reserva', desc:'Ahorro para imprevistos: amortigua los recortes', ideal:8, icon:'🏦'},
];
const SNAME = Object.fromEntries(SECTORS.map(s=>[s.id,s.name]));
const INDS = [
  {id:'calidad', name:'Calidad académica'},
  {id:'clima', name:'Clima laboral docente'},
  {id:'felicidad', name:'Felicidad estudiantil'},
  {id:'campus', name:'Estado del campus'},
  {id:'empleabilidad', name:'Empleabilidad de egresados'},
  {id:'reputacion', name:'Reputación'},
  {id:'finanzas', name:'Salud financiera'},
];
const INAME = Object.fromEntries(INDS.map(i=>[i.id,i.name]));
const BASE_MAT = 7000;  // Anáhuac Querétaro: más de 7,000 alumnos (Reporte SEAES, junio 2025)
const BASE_BUD = 2100;  // Presupuesto anual estimado en millones de pesos (ajustable con el dato oficial)
const START_IND = {calidad:76, clima:64, felicidad:66, campus:70, empleabilidad:70, reputacion:72, finanzas:60};

/* ===================== Situaciones ===================== */
// tipo: crisis | op (oportunidad) | ex (evento externo)
const SITS = {
  huelga:{tipo:'crisis', em:'✊', t:'Huelga de profesores',
    txt:'Los profesores de ingeniería anuncian paro de labores. Dicen que los sueldos no han subido y que tienen demasiados grupos por persona. Hay exámenes la próxima semana.',
    q:'¿Cómo resuelven la huelga sin quebrar el presupuesto?',
    sc:c=>Math.max((24-c.a.ch)/10,(56-c.i.clima)/12),
    ok:{ind:{clima:9,calidad:4},b:4}, no:{ind:{clima:-10,calidad:-6,felicidad:-5},b:-8,req:{s:'ch',min:30}}},
  fuga:{tipo:'crisis', em:'🚪', t:'Renuncian cinco profesores con doctorado',
    txt:'Otra universidad les ofreció mejores condiciones. Se llevan dos proyectos de investigación y la acreditación de una carrera queda en riesgo.',
    q:'¿Cómo retienen y atraen talento académico?',
    sc:c=>c.y>=3?Math.max((66-c.i.calidad)/12,(26-c.a.ch)/12*0.8):0,
    ok:{ind:{calidad:7,clima:4},b:3}, no:{ind:{calidad:-9,reputacion:-4},b:-6,req:{s:'ch',min:29}}},
  apagon:{tipo:'crisis', em:'⚡', t:'Falla eléctrica en los laboratorios',
    txt:'La instalación eléctrica del edificio de ingeniería es vieja. Un corto apagó los laboratorios tres días y se dañaron equipos.',
    q:'¿Qué hacen con la infraestructura dañada y cómo evitan que se repita?',
    sc:c=>Math.max((11-c.a.infra)/6,(60-c.i.campus)/12),
    ok:{ind:{campus:9,felicidad:3},b:3}, no:{ind:{campus:-10,felicidad:-5,calidad:-3},b:-7,req:{s:'infra',min:16}}},
  salones:{tipo:'crisis', em:'🪑', t:'Ya no alcanzan los salones',
    txt:'La matrícula creció y hay grupos de 45 alumnos en salones para 30. Los papás se quejan en redes y algunos alumnos toman clase de pie.',
    q:'¿Cómo acomodan el crecimiento?',
    sc:c=>(c.mat>BASE_MAT*1.08&&c.a.infra<15)?(c.mat/BASE_MAT-1.08)*7+(15-c.a.infra)/8:0,
    ok:{ind:{campus:6,felicidad:5},b:5}, no:{ind:{felicidad:-8,reputacion:-5},b:-6,req:{s:'infra',min:17}}},
  ciber:{tipo:'crisis', em:'🛡️', t:'Ciberataque al sistema escolar',
    txt:'Un ransomware cifró el sistema de calificaciones y pagos. Los hackers piden un rescate y circula en redes que se filtraron datos de alumnos.',
    q:'¿Pagan el rescate? ¿Cómo protegen a los alumnos y recuperan el sistema?',
    sc:c=>(9-c.a.tec)/5,
    ok:{ind:{reputacion:5,calidad:2},b:3}, no:{ind:{reputacion:-10,finanzas:-5},b:-8,req:{s:'tec',min:13}}},
  obsoleto:{tipo:'crisis', em:'🖥️', t:'Laboratorios con equipo obsoleto',
    txt:'Una empresa que recibe practicantes reporta que nuestros alumnos nunca han usado herramientas actuales. Los laboratorios tienen equipo de hace ocho años.',
    q:'¿Cómo actualizan la tecnología y qué priorizan primero?',
    sc:c=>c.y>=2?(11-c.a.tec)/6:0,
    ok:{ind:{empleabilidad:6,calidad:4},b:3}, no:{ind:{empleabilidad:-8,calidad:-4},b:-5,req:{s:'tec',min:14}}},
  desercion:{tipo:'crisis', em:'📉', t:'Ola de bajas por motivos económicos',
    txt:'Ciento cincuenta alumnos de tercer semestre pidieron baja temporal: sus familias no pueden pagar la colegiatura después de una crisis económica regional.',
    q:'¿Cómo evitan perder a estos alumnos?',
    sc:c=>Math.max((10-c.a.becas)/6,(58-c.i.felicidad)/14),
    ok:{ind:{felicidad:6,reputacion:3},b:4,mat:2}, no:{ind:{felicidad:-6,reputacion:-4},b:-7,mat:-3,req:{s:'becas',min:14}}},
  protesta:{tipo:'crisis', em:'📢', t:'Protesta estudiantil: “queremos un campus vivo”',
    txt:'La sociedad de alumnos organiza una manifestación. Dicen que no hay espacios deportivos, actividades culturales ni atención psicológica suficiente.',
    q:'¿Qué les responden y qué compromisos concretos asumen?',
    sc:c=>Math.max((8-c.a.vida)/5,(56-c.i.felicidad)/10),
    ok:{ind:{felicidad:9},b:3}, no:{ind:{felicidad:-10,reputacion:-5},b:-6,req:{s:'vida',min:12}}},
  bienestar:{tipo:'crisis', em:'🫂', t:'Alerta de bienestar estudiantil',
    txt:'El área de orientación reporta un aumento fuerte de ansiedad y agotamiento en alumnos de ingeniería durante finales. Solo hay una psicóloga para todo el campus.',
    q:'¿Qué programa de bienestar proponen y cómo lo financian?',
    sc:c=>(9-c.a.vida)/7*0.8,
    ok:{ind:{felicidad:7,calidad:2},b:2}, no:{ind:{felicidad:-8},b:-5,req:{s:'vida',min:11}}},
  redes:{tipo:'crisis', em:'📱', t:'Crisis en redes sociales',
    txt:'Un video de un alumno quejándose de la universidad se vuelve viral. Tiene dos millones de vistas y los medios locales ya llamaron para pedir declaraciones.',
    q:'¿Cuál es su estrategia de comunicación en las próximas 48 horas?',
    sc:c=>Math.max((6-c.a.mkt)/4,(62-c.i.reputacion)/12),
    ok:{ind:{reputacion:8},b:3}, no:{ind:{reputacion:-11},b:-7,mat:-2,req:{s:'mkt',min:10}}},
  admisiones:{tipo:'crisis', em:'📭', t:'Bajan las solicitudes de admisión',
    txt:'Las solicitudes para ingeniería bajaron 20% respecto al año pasado. Una universidad nueva en Querétaro está ofreciendo descuentos agresivos.',
    q:'¿Cómo atraen aspirantes sin regalar la colegiatura?',
    sc:c=>(c.g<0?(-c.g)*12:0)+(7-c.a.mkt)/6,
    ok:{ind:{reputacion:5},b:3,mat:3}, no:{ind:{reputacion:-4},b:-6,mat:-4,req:{s:'mkt',min:10}}},
  empresas:{tipo:'crisis', em:'🏭', t:'Las empresas dejan de contratar egresados',
    txt:'Tres empresas del parque industrial dejaron de recibir practicantes. Dicen que no conocen a la universidad y que prefieren alumnos con experiencia real.',
    q:'¿Cómo reconstruyen la relación con la industria?',
    sc:c=>Math.max((7-c.a.vin)/5,(60-c.i.empleabilidad)/12),
    ok:{ind:{empleabilidad:9},b:3}, no:{ind:{empleabilidad:-10,reputacion:-4},b:-6,req:{s:'vin',min:11}}},
  coventry:{tipo:'crisis', em:'🇬🇧', t:'Coventry revisa la doble titulación',
    txt:'Coventry University enviará una comisión para evaluar si la doble titulación en Engineering and Management sigue cumpliendo sus estándares. Si no, se suspende.',
    q:'¿Cómo preparan la evaluación y qué mejoras presentan?',
    sc:c=>c.y>=2?Math.max((7-c.a.vin)/6,(68-c.i.calidad)/14):0,
    ok:{ind:{reputacion:6,calidad:4,empleabilidad:3},b:4,cov:true}, no:{ind:{reputacion:-9,empleabilidad:-6},b:-8,mat:-3,cov:false,req:{s:'vin',min:12}}},
  liquidez:{tipo:'crisis', em:'💸', t:'Falta de liquidez',
    txt:'Un proveedor exige el pago inmediato de una obra terminada y no hay efectivo. Si no se paga en 30 días habrá multa y una demanda.',
    q:'¿De dónde sale el dinero y qué cambian para que no vuelva a pasar?',
    sc:c=>Math.max((5-c.a.res)/4,(52-c.i.finanzas)/12),
    ok:{ind:{finanzas:8},b:2}, no:{ind:{finanzas:-10,reputacion:-3},b:-9,req:{s:'res',min:10}}},
  sismo:{tipo:'ex', em:'🌋', t:'Un sismo daña el edificio de laboratorios',
    txt:'Protección Civil pide desalojar el edificio de laboratorios mientras se revisa la estructura. Nadie salió herido, pero 600 alumnos no tienen dónde hacer prácticas.',
    q:'¿Cómo mantienen las clases y cómo pagan la reparación?',
    sc:c=>c.y>=3?0.35:0,
    ok:{ind:{campus:4,reputacion:4},b:2}, no:{ind:{campus:-12,calidad:-5},b:-8,req:{s:'infra',min:16}}},
  inflacion:{tipo:'ex', em:'📈', t:'La inflación dispara los costos',
    txt:'La energía, el mantenimiento y los insumos de laboratorio subieron 15% este año. El presupuesto ya no rinde igual.',
    q:'¿Qué recortan, qué protegen y por qué?',
    sc:c=>c.y>=2?0.3:0,
    ok:{ind:{finanzas:6},b:2}, no:{ind:{finanzas:-8,campus:-4},b:-7,req:{s:'res',min:10}}},
  ia:{tipo:'ex', em:'🤖', t:'La inteligencia artificial cambia lo que piden las empresas',
    txt:'Las empresas ahora piden ingenieros que sepan trabajar con IA. Nuestros planes de estudio no la incluyen en casi ninguna carrera.',
    q:'¿Cómo actualizan a profesores y planes de estudio?',
    sc:c=>c.y>=2?0.35:0,
    ok:{ind:{empleabilidad:7,calidad:5,reputacion:3},b:4}, no:{ind:{empleabilidad:-8,reputacion:-4},b:-5,req:{s:'tec',min:13}}},
  alianza:{tipo:'op', em:'🤝', t:'Una empresa tecnológica quiere abrir un centro en el campus',
    txt:'Una empresa internacional propone instalar un centro de innovación dentro del campus si la universidad aporta el espacio y un equipo de profesores.',
    q:'¿Aceptan? ¿Bajo qué condiciones y qué ganan los alumnos?',
    sc:c=>(c.i.empleabilidad-76)/10,
    ok:{ind:{empleabilidad:8,reputacion:5},b:8}, no:{ind:{empleabilidad:-2},b:0}},
  ranking:{tipo:'op', em:'🏆', t:'Invitación a un ranking nacional de ingenierías',
    txt:'Un ranking nacional invita a la universidad a participar. Hay que entregar evidencias de calidad, investigación y empleabilidad en un mes.',
    q:'¿Cómo presentan a la universidad y qué destacan?',
    sc:c=>(c.i.reputacion-78)/10,
    ok:{ind:{reputacion:9},b:6,mat:3}, no:{ind:{reputacion:-3},b:0}},

function fresh(){

    history:[], current:null, constraint:null, recent:[], lastResult:null, verdict:null, coventry:true, g:0};
}
function load(){ try{ const t=localStorage.getItem(KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }

/* ===================== Utilidades ===================== */
const $ = s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Math.round(v).toLocaleString('es-MX')+' M';
const sumAlloc=a=>Object.values(a).reduce((x,y)=>x+y,0);
function matScore(m){ return clamp(50+(m/BASE_MAT-1)*100,0,100); }
function indexOf(ind,mat){
  return Math.round(0.15*ind.calidad+0.11*ind.clima+0.15*ind.felicidad+0.10*ind.campus+0.12*ind.empleabilidad+0.12*ind.reputacion+0.10*ind.finanzas+0.15*matScore(mat));
}
function verdictLabel(x){
  if(x>=80) return 'Campus de clase mundial';
  if(x>=70) return 'Campus en crecimiento sólido';
  if(x>=60) return 'Campus estable';
  if(x>=50) return 'Campus bajo presión';
  return 'Campus en crisis';
}
function f(r){ return r>=1 ? 7*(1-Math.exp(-2*(r-1))) : -12*(1-r); }
function noise(){ return (Math.random()-0.5)*2; }

/* ===================== Motor de simulación ===================== */
function closeYear(){
  const a=S.alloc, i=S.ind;
  S.prevInd={...i}; S.prevMat=S.mat;
  const R={};
  SECTORS.forEach(s=>{ const inv=a[s.id]/100*S.budget; const need=s.ideal/100*BASE_BUD*S.mat/BASE_MAT; R[s.id]=need>0?inv/need:1; });
  const F=Object.fromEntries(Object.entries(R).map(([k,v])=>[k,f(v)]));
  const d={};
  d.calidad = 0.6*F.ch+0.25*F.tec+0.15*F.vin;
  d.clima = 0.9*F.ch+0.15*F.infra;
  d.felicidad = 0.35*F.vida+0.25*F.infra+0.25*F.becas+0.15*F.tec;
  d.campus = 1.1*F.infra-1.5;
  d.empleabilidad = 0.45*F.vin+0.3*F.tec+(i.calidad-76)*0.08;
  d.reputacion = 0.35*F.mkt+0.2*F.vin+(i.calidad-76)*0.07+(i.felicidad-66)*0.06+(i.empleabilidad-70)*0.05;
  let g = 0.016*(i.reputacion-70)/10 + 0.013*(i.felicidad-64)/10 + 0.012*F.becas/5 + 0.012*F.mkt/5 + (Math.random()-0.5)*0.01;
  g = clamp(g,-0.10,0.07);
  d.finanzas = 1.0*F.res-0.5+g*40;
  INDS.forEach(({id})=>{
    let x=d[id]+noise()*0.8;
    if(x>0) x*=Math.min(1,(100-i[id])/35);
    i[id]=clamp(Math.round(i[id]+x),0,100);
  });
  S.mat=Math.round(S.mat*(1+g));
  S.g=g;
  S.reserveFund=r1(S.reserveFund+a.res/100*S.budget);
  S.lastResult={g};
  S.history.push({year:S.year,budget:S.budget,alloc:{...a},matBefore:S.prevMat,matAfter:S.mat,ind:{...i},index:indexOf(i,S.mat),sit:null,proposal:'',ok:null,comment:''});
  S.constraint=null;
  S.phase='results';
}

function pickSituation(){
  const c={a:S.alloc,i:S.ind,mat:S.mat,y:S.year,g:S.g};
  let best=null,bs=0;
  for(const [id,s] of Object.entries(SITS)){
    if(S.recent.includes(id)) continue;
    if(id==='coventry' && !S.coventry) continue;
    const sc=s.sc(c);
    if(sc<=0) continue;
    const v=sc+Math.random()*0.35;
    if(v>bs){bs=v;best=id;}
  }
  if(!best){
    const pool=['sismo','inflacion','ia'].filter(x=>!S.recent.includes(x));
    best=pool[Math.floor(Math.random()*pool.length)]||'inflacion';
  }
  S.recent=[...S.recent,best].slice(-3);
  S.current={id:best,proposal:''};
  const h=S.history[S.history.length-1]; if(h) h.sit=best;
  S.phase='situation';
}

function applyVerdict(ok,comment){
  const sit=SITS[S.current.id];
  const eff= ok?sit.ok:sit.no;
  S.prevInd={...S.ind}; S.prevMat=S.mat;
  for(const [k,v] of Object.entries(eff.ind||{})) S.ind[k]=clamp(S.ind[k]+v,0,100);
  if(eff.mat) S.mat=Math.round(S.mat*(1+eff.mat/100));
  if(eff.cov===true) S.coventry=true;
  if(eff.cov===false) S.coventry=false;
  const base=BASE_BUD*S.mat/BASE_MAT;
  let pct=eff.b||0, absorbed=0;
  if(pct<0){
    const pen=-pct/100*base;
    absorbed=r1(Math.min(S.reserveFund,pen*0.6));
    S.reserveFund=r1(S.reserveFund-absorbed);
    pct=-(pen-absorbed)/base*100;
  }
  S.nextBudget=r1(base*(1+pct/100));
  S.verdict={ok,comment,absorbed,pct:eff.b||0,req:(!ok&&eff.req)?eff.req:null};
  S.constraint=S.verdict.req;
  const h=S.history[S.history.length-1];
  if(h){ h.proposal=S.current.proposal; h.ok=ok; h.comment=comment; h.ind={...S.ind}; h.matAfter=S.mat; h.index=indexOf(S.ind,S.mat); }
  S.phase='verdict';
}

function nextYear(){
  if(S.year>=YEARS){ S.phase='final'; return; }
  S.year++; S.budget=S.nextBudget; S.nextBudget=null; S.current=null; S.verdict=null;
  if(S.constraint && S.alloc[S.constraint.s]<S.constraint.min){ /* el equipo debe reajustar */ }
  S.phase='allocate';
}

/* ===================== Ciudad (SVG) ===================== */
function seeded(n){ let x=Math.sin(n*9301+49297)*233280; return x-Math.floor(x); }
function citySVG(){
  const W=640,H=270,G=220;
  const i=S.ind, idx=indexOf(i,S.mat);
  const N=clamp(Math.round(S.mat/BASE_MAT*10),6,18);
  const lit=i.felicidad/100;
  const crisisNow=S.current && ['situation','waiting'].includes(S.phase) ? S.current.id : null;
  let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vista de la Ciudad Anáhuac: ${S.mat} alumnos, índice ${idx}">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sky)"/>
  <circle cx="560" cy="52" r="22" fill="var(--win-on)" opacity="${0.35+lit*0.65}"/>`;
  // edificios de fondo
  for(let k=0;k<14;k++){ const x=k*48-10, h=30+seeded(k+77)*40; out+=`<rect x="${x}" y="${G-h}" width="44" height="${h}" fill="var(--bldg2)" opacity=".35"/>`; }
  const slot=(W-40)/N;
  const order=[...Array(N).keys()];
  const mid=Math.floor(N/2);
  order.forEach(k=>{
    const w=slot*(0.62+seeded(k)*0.25);
    const x=20+k*slot+(slot-w)/2;
    let h=55+seeded(k+11)*55+(i.campus-50)*0.7+(idx-55)*0.6;
    if(k===mid) h+=40;
    h=clamp(h,35,G-30);
    const y=G-h;
    const fill=k===mid?'var(--bldg)':(k%2?'var(--bldg)':'var(--bldg2)');
    out+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" rx="2"/>`;
    const cols=Math.max(2,Math.floor(w/11)), rows=Math.floor((h-14)/13);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const on=seeded(k*131+r*17+c*7)<lit*(i.campus<40?0.6:1);
      const wx=x+5+c*((w-10)/cols), wy=y+8+r*13;
      out+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="${Math.max(3,(w-10)/cols-4).toFixed(1)}" height="6" fill="${on?'var(--win-on)':'var(--win-off)'}"/>`;
    }
    if(k===mid){
      out+=`<line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y-26}" stroke="var(--ink)" stroke-width="2"/><path d="M${x+w/2} ${y-26} h18 l-4 6 l4 6 h-18z" fill="var(--accent)"/>`;
    }
    if(k===mid+2 && S.coventry){
      out+=`<line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y-20}" stroke="var(--ink)" stroke-width="2"/><path d="M${x+w/2} ${y-20} h16 v10 h-16z" fill="var(--teal)"/>`;
    }
  });
  // grúa si hay inversión fuerte en infraestructura
  if(S.alloc.infra>=16){
    out+=`<g stroke="var(--warn)" stroke-width="3" fill="none"><line x1="600" y1="${G}" x2="600" y2="70"/><line x1="560" y1="74" x2="635" y2="74"/><line x1="575" y1="74" x2="575" y2="100"/></g><rect x="569" y="100" width="12" height="9" fill="var(--warn)"/>`;
  }
  out+=`<rect y="${G}" width="${W}" height="${H-G}" fill="var(--ground)"/>`;
  const trees=Math.round(i.felicidad/7);
  for(let t=0;t<trees;t++){ const tx=12+seeded(t+300)*(W-24), s=6+seeded(t+400)*5; out+=`<circle cx="${tx.toFixed(1)}" cy="${G+12+seeded(t+500)*24}" r="${s.toFixed(1)}" fill="var(--tree)"/>`; }
  // personas = matrícula
  const ppl=clamp(Math.round(S.mat/BASE_MAT*14),4,24);
  for(let p=0;p<ppl;p++){ const px=20+seeded(p+700)*(W-40), py=G+16+seeded(p+800)*28; out+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.6" fill="var(--ink)"/><rect x="${(px-2).toFixed(1)}" y="${(py+2.5).toFixed(1)}" width="4" height="6" rx="1.5" fill="var(--ink)"/>`; }
  if(crisisNow && ['huelga','protesta','fuga'].includes(crisisNow)){
    for(let p=0;p<6;p++){ const px=230+p*28; out+=`<line x1="${px}" y1="${G+30}" x2="${px}" y2="${G+8}" stroke="var(--ink)" stroke-width="1.5"/><rect x="${px-9}" y="${G}" width="18" height="11" fill="var(--bad)"/>`; }
  }
  if(crisisNow && ['apagon','sismo'].includes(crisisNow)){
    out+=`<path d="M300 40 l-14 30 h12 l-10 28 l26 -36 h-12 l10 -22z" fill="var(--warn)"/>`;
  }
  out+=`</svg>`;
  return out;
}

  if(best.d>0) h+=`<p>Lo que más mejoró: <b>${best.name}</b>.</p>`;
  if(worst.d<0) h+=`<p>Lo que más se deterioró: <b>${worst.name}</b>. Ojo: lo descuidado suele generar crisis.</p>`;
  h+=`<div class="row"><button class="btn" id="toSit" type="button">Ver la situación del año</button></div>`;
  return h;
}

/* ---------- Situación ---------- */
function sitHeader(){
  const s=SITS[S.current.id];
  const cl=s.tipo==='op'?'op':(s.tipo==='ex'?'ex':'');
  return `<div class="sit ${cl}"><span class="tag ${cl}">${TIPO_LABEL[s.tipo]}</span><div class="em" aria-hidden="true">${s.em}</div><h2>${s.t}</h2><p>${s.txt}</p></div>`;
}
function situationHTML(){
  const s=SITS[S.current.id];
  return `${sitHeader()}
    <label class="f" for="prop">${s.q}</label>
    <textarea id="prop" placeholder="Escriban su propuesta: qué harán, con qué dinero y en cuánto tiempo.">${esc(S.current.proposal)}</textarea>
    <p style="font-size:14px;color:var(--muted);margin-top:6px">Una buena propuesta es concreta, dice de dónde sale el dinero y piensa en alumnos, profesores y familias.</p>
    <div class="row"><button class="btn" id="send" type="button">Enviar propuesta al facilitador</button></div>`;
}
function waitingHTML(){
  return `${sitHeader()}
    <h3>Propuesta de la junta</h3>
    <div class="note" style="white-space:pre-wrap">${esc(S.current.proposal)}</div>
    <div class="note teal">Levanten la mano: el facilitador vendrá a revisar su propuesta.</div>
    <div class="row"><button class="btn" id="judge" type="button">Revisión del facilitador</button><button class="btn ghost" id="edit" type="button">Editar propuesta</button></div>`;
}

/* ---------- Veredicto ---------- */
function verdictHTML(){
  const v=S.verdict, s=SITS[S.current.id];
  const eff=v.ok?s.ok:s.no;
  let h=`<h2>${v.ok?'Propuesta aprobada':'Propuesta rechazada'}</h2>`;
  h+= v.ok
    ? `<div class="note good">El facilitador aprobó la solución a “${s.t}”. ${eff.b>0?`El presupuesto del próximo año sube ${eff.b}%.`:''}</div>`
    : `<div class="note bad">La solución a “${s.t}” no fue suficiente. ${eff.b<0?`El presupuesto se recorta ${-eff.b}%.`:'Se perdió la oportunidad.'}</div>`;
  if(v.comment) h+=`<p><b>Comentario del facilitador:</b> ${esc(v.comment)}</p>`;
  if(v.absorbed>0) h+=`<p>El fondo de reserva absorbió <b>${money(v.absorbed)}</b> del recorte. Por eso conviene ahorrar.</p>`;
  if(!v.ok && s.tipo!=='op' && eff.cov===false) h+=`<p>La doble titulación con Coventry quedó suspendida.</p>`;
  h+=`<div class="changes">`;
  for(const [k,d] of Object.entries(eff.ind)) h+=`<div class="chg"><small>${INAME[k]}</small><b class="${d>0?'up':'down'}">${d>0?'+':''}${d}</b></div>`;
  if(eff.mat) h+=`<div class="chg"><small>Matrícula</small><b class="${eff.mat>0?'up':'down'}">${eff.mat>0?'+':''}${eff.mat}%</b></div>`;
  h+=`</div>`;
  if(S.year<YEARS){
    h+=`<p>Presupuesto para el año ${S.year+1}: <b>${money(S.nextBudget)}</b>.</p>`;
    if(v.req) h+=`<div class="note bad">Nuevo reto: en el año ${S.year+1} deberán reajustar el presupuesto y destinar al menos ${v.req.min}% a ${SNAME[v.req.s]}.</div>`;
    h+=`<div class="row"><button class="btn" id="next" type="button">${v.req?'Reajustar presupuesto del año '+(S.year+1):'Continuar al año '+(S.year+1)}</button></div>`;
  } else {
    h+=`<div class="row"><button class="btn" id="next" type="button">Ver el resultado final de la Ciudad Anáhuac</button></div>`;
  }
  return h;
}

function bindPhase(){
  if(S.phase==='allocate'){
    document.querySelectorAll('input[type=range]').forEach(r=>{
      r.oninput=()=>{ const id=r.dataset.s; S.alloc[id]=+r.value; $('#p-'+id).textContent=r.value+'%'; $('#m-'+id).textContent=money(r.value/100*S.budget); updateSum(); };
      r.onchange=()=>{ save(); $('#app .city').innerHTML=citySVG(); };
    });
    updateSum();
    $('#close').onclick=()=>{ closeYear(); render(); window.scrollTo(0,0); };
  }
  if(S.phase==='results') $('#toSit').onclick=()=>{ pickSituation(); render(); };
  if(S.phase==='situation'){
    $('#prop').oninput=e=>{ S.current.proposal=e.target.value; save(); };
    $('#send').onclick=()=>{
      if(S.current.proposal.trim().length<20){ $('#prop').classList.remove('shake'); void $('#prop').offsetWidth; $('#prop').classList.add('shake'); $('#prop').focus(); return; }
      S.phase='waiting'; render();
    };
  }
  if(S.phase==='waiting'){
    $('#edit').onclick=()=>{ S.phase='situation'; render(); };
    $('#judge').onclick=openJudge;
  }
  if(S.phase==='verdict') $('#next').onclick=()=>{ nextYear(); render(); window.scrollTo(0,0); };
}

/* ---------- Modal facilitador ---------- */
function openModal(html){ $('#modalBody').innerHTML=html; $('#modal').classList.add('on'); const f=$('#modalBody input,#modalBody textarea'); if(f) f.focus(); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function pinStep(title,onOk){
  openModal(`<h2>${title}</h2><label class="f" for="pinIn">PIN del facilitador</label><input type="password" id="pinIn" autocomplete="off"><p id="pinErr" style="color:var(--bad);min-height:1.5em;margin-top:6px"></p><div class="row"><button class="btn" id="pinGo" type="button">Entrar</button><button class="btn ghost" id="pinX" type="button">Cancelar</button></div>`);
  const go=()=>{ if($('#pinIn').value===S.pin) onOk(); else { $('#pinErr').textContent='PIN incorrecto. Esta acción es solo para el facilitador.'; $('#pinIn').value=''; $('#pinIn').focus(); } };
  $('#pinGo').onclick=go; $('#pinIn').onkeydown=e=>{ if(e.key==='Enter') go(); }; $('#pinX').onclick=closeModal;
}
function openJudge(){
  pinStep('Revisión del facilitador',()=>{
    const s=SITS[S.current.id];
    openModal(`<h2>${s.em} ${s.t}</h2><h3 style="margin-top:8px">Propuesta del equipo</h3><div class="note" style="white-space:pre-wrap">${esc(S.current.proposal)}</div>
      <label class="f" for="cm">Comentario para el equipo (opcional)</label><textarea id="cm" style="min-height:80px" placeholder="Qué estuvo bien o qué faltó"></textarea>
      <p style="font-size:14px;color:var(--muted)">Si aprueban: ${Object.entries(s.ok.ind).map(([k,v])=>INAME[k]+' +'+v).join(', ')}${s.ok.b?`, presupuesto +${s.ok.b}%`:''}.<br>Si rechazan: ${Object.entries(s.no.ind).map(([k,v])=>INAME[k]+' '+v).join(', ')}${s.no.b?`, presupuesto ${s.no.b}%`:''}${s.no.req?`, y el equipo deberá destinar al menos ${s.no.req.min}% a ${SNAME[s.no.req.s]}`:''}.</p>
      <div class="row"><button class="btn good" id="ap" type="button">Aprobar solución</button><button class="btn bad" id="rj" type="button">Rechazar solución</button><button class="btn ghost" id="cx" type="button">Cancelar</button></div>`);
    $('#ap').onclick=()=>{ applyVerdict(true,$('#cm').value.trim()); closeModal(); render(); };
    $('#rj').onclick=()=>{ applyVerdict(false,$('#cm').value.trim()); closeModal(); render(); };
    $('#cx').onclick=closeModal;
  });
}
$('#facBtn').onclick=()=>{
  pinStep('Panel del facilitador',()=>{
    openModal(`<h2>Panel del facilitador</h2>
      <p>Equipo: <b>${esc(S.team||'sin configurar')}</b> · Año ${S.year} · Índice ${indexOf(S.ind,S.mat)}</p>
      <div class="row"><button class="btn ghost" id="fFin" type="button">Terminar simulación y ver resultado</button></div>
      <div class="row"><button class="btn ghost" id="fTheme" type="button">Cambiar tema claro/oscuro</button></div>
      <div class="row"><button class="btn bad" id="fReset" type="button">Reiniciar partida de este equipo</button></div>
      <div class="row"><button class="btn" id="fX" type="button">Cerrar</button></div>`);
    $('#fX').onclick=closeModal;
    $('#fFin').onclick=()=>{ S.phase='final'; closeModal(); render(); };
    $('#fTheme').onclick=()=>{ const d=document.documentElement; const cur=d.dataset.theme|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); d.dataset.theme=cur==='dark'?'light':'dark'; };
    $('#fReset').onclick=()=>{ if(confirm('Se borrará todo el avance de este equipo. ¿Continuar?')){ S=fresh(); closeModal(); render(); } };
  });
};

/* ---------- Final ---------- */
function chartSVG(){
  const pts=[{year:0,index:indexOf(START_IND,BASE_MAT)},...S.history.map(h=>({year:h.year,index:h.index}))];
  const W=620,H=200,px=36,py=20;
  const X=y=>px+(W-px*2)*(y/YEARS), Y=v=>H-py-(H-py*2)*((v-30)/70);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del índice por año">`;
  [40,60,80].forEach(v=>{ s+=`<line x1="${px}" x2="${W-px}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="4" y="${Y(v)+4}" font-size="12" fill="var(--muted)">${v}</text>`; });
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${pts.map(p=>X(p.year)+','+Y(clamp(p.index,30,100))).join(' ')}"/>`;
  pts.forEach(p=>{ const h=S.history.find(x=>x.year===p.year); const col=h&&h.ok===false?'var(--bad)':(h&&h.ok?'var(--good)':'var(--accent)'); s+=`<circle cx="${X(p.year)}" cy="${Y(clamp(p.index,30,100))}" r="5" fill="${col}"/><text x="${X(p.year)}" y="${H-2}" font-size="12" text-anchor="middle" fill="var(--muted)">${p.year===0?'Inicio':p.year}</text>`; });
  return s+'</svg>';
}
function finalHTML(){
  const idx=indexOf(S.ind,S.mat);
  const ap=S.history.filter(h=>h.ok===true).length, rj=S.history.filter(h=>h.ok===false).length;
  let rows='';
  S.history.forEach(h=>{ const s=h.sit?SITS[h.sit]:null; rows+=`<tr><td>${h.year}</td><td>${money(h.budget)}</td><td>${h.matAfter.toLocaleString('es-MX')}</td><td>${s?s.em+' '+s.t:'—'}</td><td>${h.ok===true?'<span class="ok">Aprobada</span>':h.ok===false?'<span class="no">Rechazada</span>':'—'}</td><td>${h.index}</td></tr>`; });
  const strongest=[...INDS].sort((a,b)=>S.ind[b.id]-S.ind[a.id])[0], weakest=[...INDS].sort((a,b)=>S.ind[a.id]-S.ind[b.id])[0];
  return `<div class="grid">
    <div>
      <div class="panel"><h3>${esc(S.team)}</h3>${S.members?`<p style="color:var(--muted)">${esc(S.members)}</p>`:''}
        <div class="final-score">${idx}</div><h2>${verdictLabel(idx)}</h2>
        <p>Índice Ciudad Anáhuac después de ${S.history.length} años de gestión.</p>
        <div class="row"><button class="btn" id="pres" type="button">${document.body.classList.contains('present')?'Salir del modo presentación':'Modo presentación'}</button></div>
      </div>
      <div class="city" style="margin-top:16px">${citySVG()}</div>
    </div>
    <div>
      <div class="panel">
        <h3>Evolución del índice</h3>${chartSVG()}
        <div class="changes">
          <div class="chg"><small>Matrícula final</small><b>${S.mat.toLocaleString('es-MX')}</b> <span class="${S.mat>=BASE_MAT?'up':'down'}">${S.mat>=BASE_MAT?'+':''}${r1((S.mat/BASE_MAT-1)*100)}%</span></div>
          <div class="chg"><small>Situaciones aprobadas</small><b class="up">${ap}</b> de ${ap+rj}</div>
          <div class="chg"><small>Fortaleza</small><b style="font-size:17px">${strongest.name}</b> ${S.ind[strongest.id]}</div>
          <div class="chg"><small>Punto débil</small><b style="font-size:17px">${weakest.name}</b> ${S.ind[weakest.id]}</div>
          <div class="chg"><small>Reserva acumulada</small><b>${money(S.reserveFund)}</b></div>
          <div class="chg"><small>Doble titulación Coventry</small><b style="font-size:17px" class="${S.coventry?'up':'down'}">${S.coventry?'Vigente':'Suspendida'}</b></div>
        </div>
      </div>
      <div class="panel" style="margin-top:16px"><h3>Indicadores finales</h3>${indicatorsHTML()}</div>
      <div class="panel" style="margin-top:16px"><h3>Bitácora de la junta</h3><div class="tbl"><table><thead><tr><th>Año</th><th>Presupuesto</th><th>Alumnos</th><th>Situación</th><th>Decisión</th><th>Índice</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    </div></div>`;
}
function bindFinal(){
  $('#pres').onclick=()=>{ document.body.classList.toggle('present'); render(); };
}

render();
</script>
</body>
</html>
